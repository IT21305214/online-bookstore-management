<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookNest | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <a href="/" class="brand">
            <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>BookNest</span>
        </a>
        <nav class="side-nav">
            <a href="/" class="nav-link active">
                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Dashboard
            </a>
            <a href="/books.html" class="nav-link">
                <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                Books
            </a>
            <a href="/book-form.html" class="nav-link">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
                Add Book
            </a>
        </nav>
    </aside>

    <div class="main">
        <header class="topbar">
            <h2>Welcome back, Admin</h2>
            <div class="user-chip"><span class="avatar">A</span> Admin</div>
        </header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h1>Dashboard</h1>
                    <p>Overview of your bookstore inventory</p>
                </div>
                <a href="/book-form.html" class="btn btn-primary">Add new book</a>
            </div>

            <section class="stats">
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                    </div>
                    <div><h3 id="totalBooks">0</h3><p>Book titles</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg class="icon" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
                    </div>
                    <div><h3 id="totalStock">0</h3><p>Copies in stock</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                    </div>
                    <div><h3 id="printedCount">0</h3><p>Printed books</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">
                        <svg class="icon" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg>
                    </div>
                    <div><h3 id="ebookCount">0</h3><p>E-books</p></div>
                </div>
            </section>

            <div class="table-card">
                <div class="section-head">
                    <h2>Recently added</h2>
                    <a href="/books.html" class="btn btn-outline">View all</a>
                </div>
                <div class="table-wrap" id="recentWrap">
                    <table>
                        <thead>
                        <tr>
                            <th>Book</th>
                            <th>Author</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Stock</th>
                        </tr>
                        </thead>
                        <tbody id="recentBody"></tbody>
                    </table>
                </div>
                <p id="recentEmpty" class="empty" style="display:none">No books yet. Add your first book!</p>
            </div>
        </main>
    </div>
</div>

<script src="/js/home.js"></script>
</body>
</html>
