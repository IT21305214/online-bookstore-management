<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookNest | Books</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
    <a href="/" class="logo">📚 BookNest</a>
    <div>
        <a href="/">Home</a>
        <a href="/books.html">Books</a>
        <a href="/book-form.html">Add Book</a>
    </div>
</nav>

<main class="container">
    <div class="page-header">
        <h1>All Books</h1>
        <a href="/book-form.html" class="btn btn-primary">+ Add Book</a>
    </div>

    <div id="alert" class="alert" style="display:none"></div>

    <form id="searchForm" class="search-bar">
        <input type="text" id="keyword" placeholder="Search by title or author...">
        <button type="submit" class="btn btn-primary">Search</button>
        <button type="button" id="clearBtn" class="btn">Clear</button>
    </form>

    <table id="bookTable" style="display:none">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Type</th>
            <th>Details</th>
            <th>Price (Rs.)</th>
            <th>Final Price (Rs.)</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="bookTableBody"></tbody>
    </table>

    <p id="emptyMessage" class="empty" style="display:none">
        No books found. Click "+ Add Book" to add one.
    </p>
</main>

<script src="/js/books.js"></script>
</body>
</html>
